<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="principale">
    <h1>CONVERTITORE DI VALUTA</h1>
    <p>dark mode</p>
    <button onclick="darkMode()">dark</button>
    <h2>Euro</h2>
    <img src="./img/Flag_of_Europe.svg">
    <form class="ricuadro">
        <input oninput="conversione()" id="conver" type="number" placeholder="Inserisci €" maxlength="10">
    </form>
  </div>
  <div class="row ">
    <div class="col-md-4">
      <h3>Dollaro americano</h3>
      <img src="./img/Flag_of_the_United_States.svg">
      <p id="dollaro"></p>
    </div>
    <div class="col-md-4">
      <h3>Sterlina</h3>
      <img src="./img/images.png">
      <p id="ster"></p></p>
    </div>
    <div class="col-md-4">
      <h3>Yen</h3>
      <img src="./img/Flag_of_Japan.svg">
      <p id="yen"></p></p>
    </div>
  </div>


  <script src="./jv/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
